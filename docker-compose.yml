services:
  shiit:
    build: .
    container_name: shiit
    user: "1000:1000"
    environment:
      - TZ=Africa/Cairo
      - PORT=3050
    volumes:
      - ./config:/data
    networks:
      - proxy
    restart: unless-stopped
    expose:
      - "3050"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shiit.rule=Host(`${SHIIT_HOSTNAME?}`)"
      - "traefik.http.routers.shiit.entrypoints=websecure"
      - "traefik.http.routers.shiit.tls.certresolver=letsencrypt"
      - "traefik.http.services.shiit.loadbalancer.server.port=3050"

networks:
  proxy:
    external: true
